<div class="kick" data-anim="kick" data-at=".1" data-vars='{"text":"kick"}'>16 · CONTACT RECORD</div>
<div class="rec">
  <div class="rechead" data-anim="fi" data-at=".35">
    <div class="recav">AR</div>
    <div><div class="recn" data-vars='{"text":"name"}'>Alex Rivers</div><div class="recr" data-vars='{"text":"status"}'>new lead</div></div>
    <div class="recpill" data-vars='{"text":"pill"}'>ACTIVE</div>
  </div>
  <div class="recrow" data-anim="fi" data-at=".9"><span class="reci"><span class="ico" data-icon="caption"></span></span><div><div class="reck" data-vars='{"text":"k1"}'>Email</div><div class="recv" data-vars='{"text":"v1"}'>alex@example.com</div></div><span class="recok">verified</span></div>
  <div class="recrow" data-anim="fi" data-at="1.5"><span class="reci"><span class="ico" data-icon="comment"></span></span><div><div class="reck" data-vars='{"text":"k2"}'>Source</div><div class="recv" data-vars='{"text":"v2"}'>Comment · GUIDE</div></div></div>
  <div class="recrow" data-anim="fi" data-at="2.1"><span class="reci"><span class="ico" data-icon="spark"></span></span><div><div class="reck" data-vars='{"text":"k3"}'>Temperature</div><div class="recv" data-vars='{"text":"v3"}'>Warm to hot</div></div><span class="recok">priority</span></div>
</div>
<div class="subcap" data-anim="fi" data-at="1.8" data-vars='{"text":"subcap"}'>A real record, row by row.</div>
