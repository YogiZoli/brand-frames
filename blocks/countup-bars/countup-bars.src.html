<div class="kick" data-anim="kick" data-at=".1">12 · COUNT-UP BARS</div>
<div class="bars">
  <div class="bcol"><div class="bnum" data-anim="count" data-at=".6" data-val="30" data-suffix="s" style="color:var(--blue)">0</div>
    <div class="bbar" data-anim="barsh" data-at=".6" data-dur="1.5" style="background:var(--blue);height:126px"></div>
    <div class="blbl">Video length</div></div>
  <div class="bcol"><div class="bnum" data-anim="count" data-at="1.6" data-val="54" data-suffix="s" style="color:var(--green-700)">0</div>
    <div class="bwrap"><span class="bbadge ongreen" data-anim="pop" data-at="3.2" data-pulse="3.6">measured</span>
    <div class="bbar" data-anim="barsh" data-at="1.6" data-dur="1.5" style="background:var(--green);height:227px"></div></div>
    <div class="blbl">Machine time</div></div>
</div>
