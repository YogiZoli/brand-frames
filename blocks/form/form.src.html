<div class="kick" data-anim="kick" data-at=".1" data-vars='{"text":"kick"}'>15 · FORM · LETTERS IN PROGRESS</div>
<div style="position:relative">
  <div class="form">
    <div class="fh" data-vars='{"text":"heading"}'>Get the guide</div>
    <div class="fhs" data-vars='{"text":"subheading"}'>Enter your details and it arrives in a minute.</div>
    <div class="flab">Full name</div>
    <div class="fin" data-anim="type" data-at=".7" data-dur="1.3" data-val="Alex Rivers" data-vars='{"data-val":"field1"}'></div>
    <div class="flab">Email address</div>
    <div class="fin" data-anim="type" data-at="2.3" data-dur="1.6" data-val="alex@example.com" data-vars='{"data-val":"field2"}'></div>
    <div class="fbtn" data-pulse="4.4" data-vars='{"text":"button"}'>Send it to me</div>
  </div>
  <span class="mouse" data-anim="click" data-at=".2" data-dur=".85" data-path="880,60;540,250;540,250;540,405;540,545"></span>
</div>
