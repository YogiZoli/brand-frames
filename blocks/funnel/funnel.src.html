<div class="kick" data-anim="kick" data-at=".1" data-var-text="kick">FUNNEL</div>
<div class="fnl" data-anim="funnelin" data-at=".4" data-dur="2.2">
  <div class="fnst"><span class="fnl-l" data-var-text="s1l">Watched the video</span><span class="fnl-r" data-var-text="s1r">100%</span></div>
  <div class="fnst"><span class="fnl-l" data-var-text="s2l">Left a comment</span><span class="fnl-r" data-var-text="s2r">18%</span></div>
  <div class="fnst"><span class="fnl-l" data-var-text="s3l">Opened the guide</span><span class="fnl-r" data-var-text="s3r">11%</span></div>
  <div class="fnst"><span class="fnl-l" data-var-text="s4l">On the list</span><span class="fnl-r" data-var-text="s4r">9%</span></div>
</div>
<div class="sub" data-anim="fi" data-at="1" data-var-text="caption">The last stage is the one that pays.</div>
