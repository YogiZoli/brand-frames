<div class="kick" data-anim="kick" data-at=".1" data-vars='{"text":"kick"}'>39 &middot; LEAD CARD &middot; ONE REAL PERSON</div>
<div class="lead" data-anim="fi" data-at=".35" data-dur=".8">
  <span class="leadav"><span class="ico" data-icon="client"></span></span>
  <div class="leadmain">
    <div class="leadn" data-anim="fi" data-at=".7" data-vars='{"text":"name"}'>Alex Rivers</div>
    <div class="leadr" data-anim="fi" data-at=".95" data-vars='{"text":"role"}'>Course creator &middot; 4 months in</div>
    <div class="leadtags" data-anim="pops" data-at="1.4">
      <span class="ltag" data-vars='{"text":"tag1"}'>commented GUIDE</span>
      <span class="ltag" data-vars='{"text":"tag2"}'>opened twice</span>
      <span class="ltag g" data-vars='{"text":"tag3"}'>replied</span>
    </div>
  </div>
  <div class="leadscore"><div class="v" data-anim="count" data-at="1.9" data-dur="1.4" data-val="86" data-vars='{"data-val":"score"}'>0</div>
    <div class="k" data-vars='{"text":"scoreLabel"}'>ready</div></div>
</div>
<div class="subcap" data-anim="fi" data-at="2.2" data-vars='{"text":"subcap"}'>Not a number. A person.</div>
