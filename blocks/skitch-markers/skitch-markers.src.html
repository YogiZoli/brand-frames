<div class="kick" data-anim="kick" data-at=".1" data-vars='{"text":"kick"}'>28 &middot; SKITCH MARKERS</div>
<div class="skrow" data-anim="pops" data-at=".4">
  <div class="skcell"><span class="skm red tail"><span class="ico" data-glyph="cross"></span></span><div class="skcap" data-vars='{"text":"c1"}'>wrong</div></div>
  <div class="skcell"><span class="skm blue tail"><span class="ico" data-glyph="query"></span></span><div class="skcap" data-vars='{"text":"c2"}'>question</div></div>
  <div class="skcell"><span class="skm amber tail"><span class="ico" data-glyph="bang"></span></span><div class="skcap" data-vars='{"text":"c3"}'>watch out</div></div>
  <div class="skcell"><span class="skm green tail"><span class="ico" data-glyph="check"></span></span><div class="skcap" data-vars='{"text":"c4"}'>approved</div></div>
  <div class="skcell"><span class="skm pink tail"><span class="ico" data-glyph="heart"></span></span><div class="skcap" data-vars='{"text":"c5"}'>loved</div></div>
</div>
<div class="subcap" data-anim="fi" data-at="2.2" data-vars='{"text":"subcap"}'>Drawn glyphs. Never a font.</div>
