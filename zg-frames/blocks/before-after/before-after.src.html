<div class="kick" data-anim="kick" data-at=".1" data-vars='{"text":"kick"}'>36 · BEFORE / AFTER</div>
<div class="ba" data-anim="wipe" data-at=".9" data-dur="2">
  <div class="bstate bbefore" data-layout-allow-overlap>
    <div class="bkey" data-layout-allow-overlap>before</div><div class="bval" data-layout-allow-overlap>40 minutes</div>
    <div class="bnote" data-layout-allow-overlap>to fix one wrong word, after the render</div></div>
  <div class="bstate bafter" data-layout-allow-overlap>
    <div class="bkey">after</div><div class="bval">One line</div>
    <div class="bnote">to fix the same word, in the scene table</div></div>
  <span class="bawipe" data-layout-allow-overlap></span>
</div>
<div class="subcap" data-anim="fi" data-at="2.2" data-vars='{"text":"subcap"}'>One wipe carries the comparison.</div>
