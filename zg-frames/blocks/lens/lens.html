.recok{margin-left:auto;background:var(--green-bg);color:var(--green-dk);font-size:32px;font-weight:800;
  padding:10px 22px;border-radius:40px}

/* 8. END CARD — smaller title, meaningful icon */
.ectitle{font-size:78px}
.appic{display:flex;align-items:center;justify-content:center}
.appic svg{width:58px;height:58px}

/* ===== v1.2 — SCALE.md compliance + scene fixes (FEEDBACK-LOG 2026-08-17 (3)) ===== */

/* bars: badge is a normal flex item above the bar — no negative offsets ever */
.bwrap{position:relative;display:flex;flex-direction:column;align-items:center}
.bbadge{position:static;transform:none;margin-bottom:16px;white-space:nowrap;
  background:var(--red);color:#fff;font-size:32px;font-weight:800;padding:8px 24px;border-radius:40px}
.bbadge.amber{background:#b26a00}
.bnum{font-size:62px;font-weight:800;margin-bottom:16px}
.bars{display:flex;gap:104px;align-items:flex-end;height:auto;margin-top:24px}
.blbl{font-size:40px;color:var(--muted);font-weight:700;margin-top:24px}

/* proportion bars: a third bar is sharply different — red preferred */
.fbar.third{background:var(--red)!important}

/* HIGHLIGHTER — the emphasis Zoltan liked: a soft slanted band swipes in under a word */
.hl{position:relative;display:inline-block;z-index:0}
.hlb{position:absolute;left:-12px;right:-12px;bottom:8px;height:40%;z-index:-1;
  background:rgba(18,161,80,.30);border-radius:6px;
  transform:skewX(-8deg) scaleX(0);transform-origin:left center}
.hlb.amber{background:rgba(250,199,117,.60)}

/* SKITCH markers — circle + tab + glyph, solid. Meaning never rests on colour alone. */
.sk{position:relative;width:104px;height:78px;display:inline-flex;align-items:center;justify-content:center}
.sksvg{width:104px;height:78px;overflow:visible}
.skg{font-size:40px;font-weight:800;fill:#fff}
.skrow{display:flex;gap:64px;align-items:center;justify-content:center}
.skcap{font-size:32px;font-weight:700;color:var(--muted);text-align:center;margin-top:8px}

/* form: smaller and more lifelike (v3-07) */
.form{width:880px;padding:40px 48px}
.fh{font-size:50px;margin-bottom:8px}
.fhs{font-size:32px;margin-bottom:24px}
.flab{font-size:32px;margin-top:24px}
.fin{margin-top:8px;min-height:78px;padding:16px 24px;font-size:40px}
.caret{height:40px}
.fbtn{margin-top:24px;font-size:40px;padding:24px 0}

/* chart: the travelling dot is the lead actor, the rest stay quiet */
.cdot{opacity:.35}
.cdot.lead{opacity:1}
.ctrav{fill:var(--green)}

/* ===== role overrides — hierarchy must never flatten (SCALE.md) ===== */
.kick{font-size:62px;letter-spacing:8px}          /* --fs-lead  */
.sub{font-size:50px}                              /* --fs-body  */
.cpill{font-size:50px;padding:24px 48px}          /* --fs-body  */
.pillout{font-size:40px;padding:24px 56px}        /* --fs-caption */
.title{font-size:122px} .title.sm{font-size:98px}
.ectitle{font-size:98px}
.ptitle{font-size:32px} .prow{font-size:40px}
.tl{font-size:40px} .scl{font-size:40px} .plbl{font-size:40px}
.recn{font-size:50px} .recv{font-size:40px} .reck{font-size:32px}
.l3n{font-size:50px} .l3r{font-size:32px} .callout{font-size:40px}
.quote{font-size:78px} .lenstxt{font-size:62px}
.icon{font-size:78px} .mk{font-size:62px} .tico{font-size:40px}
.cx{font-size:32px} .fl{font-size:62px} .fr{font-size:40px}
.ecpill{font-size:32px} .ecbtn{font-size:50px}
.ilbl{font-size:40px;margin-top:16px}
.rlbl{font-size:32px}

/* v1.3: negative vs positive differ in LIGHTNESS too, not only hue (CVD proof) */
.mk.x{background:var(--red);color:#fff}
.mk.ok{background:var(--green-bg);color:var(--green-dk)}
.pflag{background:var(--red);color:#fff}
.pflag.ok{background:var(--green-bg);color:var(--green-dk)}
.lenswrap .lens{left:0;top:0}

/* ================= v1.3 — DESIGN-FOUNDATION.md compliance ================= */

/* colour ramps (5 stops) — no more ad-hoc hexes */
/* rampak = kanon (projects/design-system/tokens.css). Nincs ad-hoc hex. */
:root{
  --blue-50:#EBF3FE; --blue-100:#D6E6FD; --blue-500:#1E7CE8; --blue-700:#144F9F; --blue-900:#15355F;
  --green-50:#E4F5EA; --green-100:#BFE8CC; --green-500:#12A150; --green-700:#0C6A36; --green-900:#0A4228;
  --red-50:#FCECED; --red-100:#FBD5D3; --red-500:#E5484D; --red-700:#B83230; --red-900:#8A2320;
  --amber-50:#FBF2DD; --amber-100:#FAE2BB; --amber-500:#E5A400; --amber-700:#B26A00;
  --navy-50:#F6F8FC; --navy-100:#EDF1F7; --navy-500:#6A7688; --navy-700:#333D4C; --navy-900:#1E2733;
  --pink-500:#d4537e;
  --hl-yellow:#ffd94a; --hl-pink:#ffadc9; --hl-green:#9ae6a8;
  --r-chip:6px; --r-btn:12px; --r-card:16px; --r-panel:24px;
  --e-1:0 2px 6px rgba(14,32,56,.06), 0 10px 20px -8px rgba(14,32,56,.10);
  --e-2:0 4px 10px rgba(14,32,56,.07), 0 26px 50px -18px rgba(14,32,56,.16);
  --e-3:0 8px 18px rgba(14,32,56,.09), 0 44px 84px -28px rgba(14,32,56,.22);
}

/* 1. LINE-HEIGHT — the fix for "össze van nyomva". Bigger type = tighter leading. */
.kick{line-height:1.30}
.sub{line-height:1.40;max-width:1200px}
.title{line-height:1.10} .title.sm{line-height:1.16}
.bigw,.disp,.ectitle{line-height:1.10}
.scl,.tl,.prow,.recv,.l3n{line-height:1.22}
.blbl,.rlbl,.ilbl,.reck,.skcap,.ptitle,.cx{line-height:1.50}

/* 2. TRACKING — em only, never px. Big type tightens, tracked caps open up. */
.title,.bigw,.disp,.ectitle{letter-spacing:-.03em}
.title.sm{letter-spacing:-.02em}
.kick{letter-spacing:.12em}
.sub{letter-spacing:0}
.reck,.ptitle,.rlbl,.recr,.l3r,.ecpill,.flab,.plateTag,.cx{letter-spacing:.16em}
.cpill,.pillout{letter-spacing:.01em}

/* 3. VERTICAL RHYTHM — air BETWEEN lines comes from gap, not leading */
.cam{gap:64px}
.stmt{gap:16px}
.tiles{gap:64px} .split{gap:104px} .bars{gap:168px} .pers{gap:168px} .skrow{gap:104px}
.rstop{gap:40px}
.funnel{gap:40px}
.recrow{padding:32px 40px}
.prow{padding:32px 0}

/* 4. SHAPE — max three radii, icons always circular */
.tile,.scard,.panel,.rec,.form{border-radius:var(--r-card)}
.device,.plate{border-radius:var(--r-panel)}
.fin,.fbtn,.callout,.l3,.pop{border-radius:var(--r-btn)}
.badge,.bbadge,.pbadge,.recpill,.recok,.ecpill,.cpill,.pillout{border-radius:999px}

/* 5. ELEVATION — one light source, two layers */
.tile,.scard,.icon,.pcirc,.ringface{box-shadow:var(--e-2)}
.panel,.rec,.form,.device{box-shadow:var(--e-3)}
.pop,.callout,.l3,.sh{box-shadow:var(--e-1)}

/* 6. badge: loud on purpose — red (Zoltan: piros vagy narancs, ahogy jobb) */
.bbadge{background:var(--red-500);color:#fff}

/* 7. HIGHLIGHTER — yellow marker pen, hand-drawn, multiply blend */
.hlb{position:absolute;left:-16px;right:-16px;bottom:2px;height:52%;z-index:-1;
  background:none;transform:none;overflow:visible}
.hlb svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;overflow:visible}
.hlb path{fill:var(--hl-yellow);opacity:.62}
.hlb.pink path{fill:var(--hl-pink)} .hlb.green path{fill:var(--hl-green)}

/* 8. stroke weights */
.rseg,.rfill,.rbold{height:9px}
.cline{stroke-width:9px}
.arline{stroke-width:11px}
.prsame,.porb,.ringbar,.ringtrack{border-width:5px;stroke-width:5px}

/* ================= v1.4 ================= */

/* highlighter: a marker pen runs OVER the lower half of the letters, not under them */
.hlb{left:-18px;right:-18px;bottom:auto;top:42%;height:58%;z-index:-1}

/* rail: tracking made the labels wrap - give the stops room */
.rstop{width:300px}
.rlbl{letter-spacing:.10em;white-space:nowrap}

/* tabular numerals: counters must not jiggle while counting up */
.bnum,.recv,.cx,.shts,.lenstxt{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* optical centre: the eye reads centre as slightly above the mathematical centre */
.cam{padding-bottom:230px}

/* localisation tolerance: every text box survives +30% length (25 languages) */
.scl,.tl,.recv,.prow,.l3n,.callout,.skcap{overflow-wrap:break-word;hyphens:auto}
.cpill,.pillout{max-width:1500px;white-space:normal;text-align:center}

/* ================= v1.5 ================= */

/* ICONS — real SVG, one stroke weight, always in a circle. Letters are banned. */
.ico{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.ico svg{width:52%;height:52%}
.icon{font-size:0}
.tico{font-size:0} .tico .ico svg{width:56%;height:56%}
.reci .ico svg{width:58%;height:58%}
.ringface .ico svg{width:46%;height:46%}

/* ZOOM — a real magnifier: big circle, text at 2.2x, and the zoom is SEEN */
.lens{width:420px;height:420px;border-width:9px}
.lenstxt{font-size:122px;letter-spacing:-.02em}
.lens .lenstxt{transform-origin:center}

/* SIGNATURE MOVE — the closing ring. One per section end. */
.sigwrap{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center}
.sigsvg{position:absolute;inset:0;transform:rotate(-90deg)}
.sigtrack{fill:none;stroke:var(--navy-100);stroke-width:5}
.sigbar{fill:none;stroke:var(--green-500);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:2000;stroke-dashoffset:2000}
.sigface{width:150px;height:150px;border-radius:50%;background:var(--card);
  box-shadow:var(--e-2);display:flex;align-items:center;justify-content:center;color:var(--green-700)}
.sigface .ico svg{width:46%;height:46%}

/* ================= v1.6 — HF-v6 feedback + the last archetype families ========== */

/* ---- 0. THE SAFE AREA RULE (HF-v6-03, "kilógó szöveg") ----------------------
   The cam is a column flexbox. Flex items shrink by default, so a tall card was
   being SQUASHED and then clipped by its own overflow:hidden — the row simply
   vanished under the rounded corner. Content is never compressed to fit; if it
   does not fit, the scene is too dense and the scene table is wrong. */
.cam > *{flex:0 0 auto}
.cam{padding:96px 150px 210px;gap:56px}
/* a panel-led scene breathes less: the panel IS the content */
.cam.dense{gap:40px;padding-bottom:170px}

/* ---- 1. CONTACT RECORD — compact enough that four rows always fit ---------- */
.rec{width:1200px;max-height:660px}
.rechead{padding:30px 40px}
.recav{width:84px;height:84px;font-size:40px}
.recrow{padding:22px 40px;gap:20px}
.reci{width:56px;height:56px}
.reck{line-height:1.35}
.recv{line-height:1.15}

/* ---- 2. SKITCH MARKERS, rebuilt (HF-v6-01, "szar ikonok megint") ------------
   What was wrong: the glyph was a FONT CHARACTER (&#10007; &#10003; ? ! &#9829;)
   drawn into an SVG <text>. Font characters have their own baseline, their own
   optical weight and their own metrics — they never sit centred in a disc and
   they never match the stroke weight of the real icon set. On top of that the
   "tab" was a raw triangle glued to the circle, which reads as a rendering
   error, not as a pointer.
   What it is now: a solid disc, a WHITE RING so it survives on any footage, a
   drawn glyph from icons.js on the same 24-grid as every other icon, and an
   optional teardrop tail that is part of the same shape. */
.skm{position:relative;width:104px;height:104px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 18px rgba(14,32,56,.28), 0 0 0 6px #fff;}
.skm .ico{width:100%;height:100%}
.skm .ico svg{width:56%;height:56%}
.skm.red{background:var(--red-500)}
.skm.blue{background:var(--blue-500)}
.skm.amber{background:var(--amber-700)}
.skm.green{background:var(--green-500)}
.skm.pink{background:var(--pink-500)}
/* NO TAIL. Zoltan's own reference markers have none, and every tail we drew read as
   a rendering artefact — which was exactly the complaint. The disc IS the marker. */
.skm.tail:after{content:none;position:absolute;right:-6px;bottom:-2px;width:34px;height:34px;
  background:inherit;border-radius:4px 0 26px 0;transform:rotate(6deg);z-index:-1;
  box-shadow:0 0 0 6px #fff}
.skrow{display:flex;gap:104px;align-items:flex-start;justify-content:center}
.skcell{display:flex;flex-direction:column;align-items:center;gap:24px;width:230px}
.skcap{font-size:40px;font-weight:800;color:var(--navy-700);text-align:center;line-height:1.2}

/* ---- 3. LENS POP BUBBLES (HF-v6-05, "kimaradt 2 uj beuszo szovegbuborek") --
   The lens says WHERE to look. The bubble says WHAT it means. They arrive after
   the lens has landed, never before — otherwise the eye has two masters. */
.pop{position:absolute;background:var(--card);border-radius:var(--r-btn);
  padding:20px 28px;box-shadow:var(--e-2);opacity:0;text-align:left;max-width:520px}
.pop:after{content:"";position:absolute;left:44px;bottom:-14px;width:28px;height:28px;
  background:var(--card);transform:rotate(45deg);border-radius:4px}
.pop.up:after{bottom:auto;top:-14px}
.popk{font-size:32px;font-weight:800;letter-spacing:.16em;color:var(--blue-700);
  text-transform:uppercase;line-height:1.5}
.popv{font-size:40px;font-weight:800;color:var(--navy-900);line-height:1.22;margin-top:4px}
.pop.g .popk{color:var(--green-700)}

/* ---- 4. THE LAST TEN ARCHETYPES -------------------------------------------
   Indexed by what the narrator is DOING, exactly like the first 29. */

/* 4a. BRANCH — "it goes one of two ways" (Sorba rendez) */
.branch{position:relative;width:1440px;height:420px}
.branch svg{position:absolute;inset:0;overflow:visible}
.brstem,.brleg{fill:none;stroke:var(--blue-500);stroke-width:11;stroke-linecap:round}
.brleg.no{stroke:var(--navy-100)}
.brend{position:absolute;display:flex;align-items:center;gap:20px;background:var(--card);
  border-radius:var(--r-btn);padding:22px 32px;box-shadow:var(--e-2);
  font-size:40px;font-weight:800;color:var(--navy-900);line-height:1.22;white-space:nowrap}
.brend .skm{width:64px;height:64px;box-shadow:0 0 0 4px #fff}
.brend.win{box-shadow:var(--e-2), 0 0 0 5px var(--green-500)}
.brroot{position:absolute;left:0;top:50%;transform:translateY(-50%);
  font-size:50px;font-weight:800;color:var(--navy-900);white-space:nowrap}

/* 4b. FUNNEL — "many arrive, few finish" (Sorba rendez) */
.fnl{display:flex;flex-direction:column;align-items:center;gap:16px;width:1440px}
.fnst{display:flex;align-items:center;justify-content:space-between;
  height:112px;border-radius:var(--r-btn);padding:0 44px;color:#fff;
  box-shadow:0 20px 44px -20px rgba(14,32,56,.42)}
.fnst:nth-child(1){width:100%;background:var(--blue-500)}
.fnst:nth-child(2){width:78%;background:var(--blue-700)}
.fnst:nth-child(3){width:56%;background:var(--green-500)}
/* a legszűkebb szakasz kap +30% hosszt is: a magyar felirat hosszabb az angolnál */
.fnst:nth-child(4){width:46%;background:var(--green-700)}
.fnst:nth-child(3){width:64%}
.fnst:nth-child(2){width:82%}
.fnl .fnl-l{font-size:50px;font-weight:800;white-space:nowrap}
.fnl .fnl-r{font-size:40px;font-weight:800;opacity:.9;font-variant-numeric:tabular-nums}

/* 4c. CYCLE — "it comes back round" (Sorba rendez). Draws once. Never spins. */
.cyc{position:relative;width:520px;height:520px}
.cycsvg{position:absolute;inset:0;transform:rotate(-90deg)}
.cyctrack{fill:none;stroke:var(--navy-100);stroke-width:9}
.cycpath{fill:none;stroke:var(--blue-500);stroke-width:9;stroke-linecap:round}
.cycnode{position:absolute;width:132px;height:132px;border-radius:50%;background:var(--card);
  box-shadow:var(--e-2);display:flex;align-items:center;justify-content:center;color:var(--blue-500)}
.cycnode .ico svg{width:50%;height:50%}
.cycnode.g{color:var(--green-500)}
.cyclbl{position:absolute;font-size:40px;font-weight:800;color:var(--navy-700);white-space:nowrap}
.cyccentre{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px}
.cyccentre .t{font-size:50px;font-weight:800;color:var(--navy-900)}
.cyccentre .s{font-size:32px;font-weight:700;letter-spacing:.16em;
  color:var(--label);text-transform:uppercase;line-height:1.5}

/* 4d. GAUGE — "how far along is it" (Szamol) */
.gauge{position:relative;width:620px;height:360px}
.gaugesvg{position:absolute;inset:0}
.gaugetrack{fill:none;stroke:var(--navy-100);stroke-width:26;stroke-linecap:round}
.gaugebar{fill:none;stroke:var(--green-500);stroke-width:26;stroke-linecap:round}
.gneedle{position:absolute;left:50%;bottom:60px;width:10px;height:190px;margin-left:-5px;
  background:var(--navy-900);border-radius:6px;transform-origin:50% 100%}
.ghub{position:absolute;left:50%;bottom:44px;width:44px;height:44px;margin-left:-22px;
  border-radius:50%;background:var(--navy-900)}
.gnum{position:absolute;left:0;right:0;bottom:-56px;text-align:center;
  font-size:98px;font-weight:800;color:var(--navy-900);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}

/* 4e. QUOTE — "someone said it better" (Kijelent) */
.qcard{position:relative;width:1440px;background:var(--card);border-radius:var(--r-card);
  padding:64px 80px 56px;box-shadow:var(--e-3);text-align:left}
.qmark{position:absolute;left:56px;top:-34px;width:96px;height:96px;border-radius:50%;
  background:var(--blue-500);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--e-2)}
.qmark .ico svg{width:52%;height:52%}
.qtext{font-size:78px;font-weight:800;font-style:italic;line-height:1.18;letter-spacing:-.02em;
  color:var(--navy-900);margin-top:24px}
.qtext b{color:var(--green-700)}
.qopen,.qq{color:var(--blue-500);font-style:italic}
.qq{display:inline-block;opacity:0}
/* AUTHOR jobbra rendezve, ha idézet. Feedback 2026-08-29. */
.qwho{display:flex;flex-direction:row-reverse;align-items:center;gap:20px;margin-top:40px;
  justify-content:flex-start;text-align:right}
.qbar{width:10px;height:60px;border-radius:6px;background:var(--green-500);flex:none}
.qname{font-size:40px;font-weight:800;color:var(--navy-900);line-height:1.22}
.qrole{font-size:32px;font-weight:700;letter-spacing:.16em;color:var(--label);
  text-transform:uppercase;line-height:1.5}

/* 4f. QUESTION — "the thing you are actually asking" (Kijelent) */
.qask{display:flex;flex-direction:column;align-items:center;gap:40px}
.qbadge{width:150px;height:150px;border-radius:50%;background:var(--blue-50);
  color:var(--blue-500);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--e-2)}
.qbadge .ico svg{width:52%;height:52%}
.qline{font-size:98px;font-weight:800;line-height:1.10;letter-spacing:-.03em;
  color:var(--navy-900);text-align:center;max-width:1500px}
.qline em{font-style:normal;color:var(--blue-500)}

/* 4g. BEFORE / AFTER — "this became that" (Szembeallit) */
.ba{position:relative;width:1440px;height:440px;border-radius:var(--r-card);
  overflow:hidden;box-shadow:var(--e-3)}
.bstate{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;padding:0 80px;text-align:center}
.bbefore{background:var(--navy-50)}
.bafter{background:var(--green-50)}
.bkey{font-size:32px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  line-height:1.5;color:var(--label)}
.bafter .bkey{color:var(--green-700)}
.bval{font-size:98px;font-weight:800;letter-spacing:-.03em;line-height:1.10;color:var(--navy-900)}
.bafter .bval{color:var(--green-700)}
.bnote{font-size:40px;font-weight:700;color:var(--muted);line-height:1.22}
.bawipe{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;background:var(--green-500);
  box-shadow:0 0 28px rgba(18,161,80,.55);opacity:0}

/* 4h. GRID — "there are many of them" (Felsorol) */
.gwrap{display:grid;grid-template-columns:repeat(8,1fr);gap:24px;width:1540px}
.gcell{height:112px;border-radius:var(--r-btn);background:var(--card);box-shadow:var(--e-1);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:800;color:var(--navy-500);line-height:1.5}
/* white on green-500 is 2.95:1 — under the 3:1 floor. The darker stop clears it. */
.gcell.on{background:var(--green-700);color:#fff;box-shadow:var(--e-2)}
.gcap{font-size:50px;font-weight:800;color:var(--navy-900);line-height:1.22}

/* 4i. CODE / COMMAND — "here is the exact thing to type" (Megmutat) */

   HOL NEM FUT LE
   Kódot és parancsot soha nem érint (.cmd, .cmdline, code, pre). Ott a
   gépíró idézőjel a HELYES, mert az a valóság: azt kell begépelni.
   --------------------------------------------------------------------------- */

  var SKIP = ".cmd, .cmdline, .cmdbody, code, pre, [data-type-raw]";

  var RX_ELLIPSIS = /\.\.\./g;
  var RX_TIMES = /(\d)\s*[xX]\s*(\d)/g;

    s = s.replace(/"/g, c);

        { clipPath: "inset(0 0% 0 0)", duration: d || .8, ease: E.enter }, at);
      else tl.fromTo(e, { scaleX: 0 }, { scaleX: 1, duration: d || .8, ease: E.enter,
        transformOrigin: "left center" }, at);
    },
    /* CHART LEAD DOT — travels the polyline at constant speed, then stops and pulses */
    leaddot: function (e, at, d) {
      var poly = e.parentNode.querySelector(".cline");
      var dot = e.parentNode.querySelector(".ctrav");
      if (!poly || !dot) return;
      var pts = poly.getAttribute("points").trim().split(/\s+/).map(function (s) {
        var a = s.split(","); return { x: +a[0], y: +a[1] };
      });
      var segs = [], total = 0, i;
      for (i = 1; i < pts.length; i++) {
        var L = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
        segs.push(L); total += L;
      }
      d = d || 2.6;
      tl.set(dot, { attr: { cx: pts[0].x, cy: pts[0].y }, opacity: 1 }, at);
      var t = at;
      for (i = 1; i < pts.length; i++) {
        var dur = d * (segs[i - 1] / total);
        tl.to(dot, { attr: { cx: pts[i].x, cy: pts[i].y }, duration: dur, ease: "none" }, t);
        t += dur;
      }
      pulse(dot, t + .1, 1.6);
    },
    dzoom:  function (e, at, d) {
      tl.fromTo(e, { scale: 1, x: 0, y: 0 },
        { scale: n(e.dataset.scale, 1.6), x: n(e.dataset.px, -180), y: n(e.dataset.py, -90),
          duration: d || 2.2, ease: E.move }, at);
    },
    cursor: function (e, at, d) {
      var p = (e.dataset.path || "0,0").split(";").map(function (s) { return s.split(",").map(Number); }),
          step = (d || 2.4) / Math.max(1, p.length - 1);
      tl.set(e, { x: p[0][0], y: p[0][1] }, at);
      for (var i = 1; i < p.length; i++) {
        tl.to(e, { x: p[i][0], y: p[i][1], duration: step, ease: E.move }, at + (i - 1) * step);
      }
    },
    /* mouse travels through N waypoints then "clicks" the last one.
       Feedback 2026-08-29 (FORM): a kurzor MÁR AZ ELEJÉN legyen ott, és vigye
       be az egeret a mezőre, mielőtt a gépelés indul. Több pont a path-ban:
       előbb a name mezőre, majd az email mezőre, végül a gombra. */
    click:  function (e, at, d) {
      var p = (e.dataset.path || "0,0").split(";").map(function (s) { return s.split(",").map(Number); });
      var seg = d || 1.1;
      tl.set(e, { x: p[0][0], y: p[0][1], opacity: 0 }, at);
      tl.to(e, { opacity: 1, duration: .3 }, at);
      for (var i = 1; i < p.length; i++) {
        tl.to(e, { x: p[i][0], y: p[i][1], duration: seg, ease: E.move }, at + .2 + (i - 1) * seg);
      }
      var endT = at + .2 + (p.length - 1) * seg;
      tl.to(e, { scale: .82, duration: .12, yoyo: true, repeat: 1, ease: E.exit }, endT);
    }
  };

  /* ---- auto patterns ---- */

  function autoArrow(g, s, d) {
    var cells = g.querySelectorAll(".icell"), line = g.querySelector(".arline"),
        head = g.querySelector(".arhead"), dot = g.querySelector(".tdot"),
        rings = g.querySelectorAll(".pring, .prsame");
    if (!cells.length) return;
    tl.fromTo(cells[0], { opacity: 0, scale: .82 }, { opacity: 1, scale: 1, duration: .7, ease: E.enter }, s + .25);
    if (line) A.draw(line, s + .9, .9);
    if (dot) A.travel(dot, s + .95, 1, n(dot.dataset.val, 300));
    if (head) A.draw(head, s + 1.7, .35);
    if (cells[1]) tl.fromTo(cells[1], { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: .9, ease: E.enter }, s + 1.15);
    if (d >= 4) {
      for (var i = 0; i < rings.length; i++) A.pring(rings[i], s + 2.4, d - 3);
      pulse(cells[cells.length - 1].querySelector(".icon"), s + 2.4, d - 3);
    }
  }

  function autoRail(r, s, d) {
    var stops = r.querySelectorAll(".rstop"), segs = r.querySelectorAll(".rseg"),
        t0 = s + .3, step = Math.min(1.1, Math.max(.5, (d - 1.6) / Math.max(1, stops.length)));
    stops.forEach(function (st, i) { A.pop(st, t0 + i * step * 2); });
    segs.forEach(function (sg, i) {
      var f = sg.querySelector(".rfill"), b = sg.querySelector(".rbold");
      if (f) tl.fromTo(f, { scaleX: 0 }, { scaleX: 1, duration: step * 1.5, ease: E.move }, t0 + i * step * 2 + .4);
      if (b) tl.fromTo(b, { x: -160, opacity: 0 }, { x: sg.offsetWidth, opacity: 1, duration: step * 1.6, ease: E.move }, t0 + i * step * 2 + .4);
    });
    var last = stops[stops.length - 1];
    if (last) {
      var lt = t0 + (stops.length - 1) * step * 2 + .5;
      tl.add(function () { last.classList.add("on"); }, lt);
      pulse(last.querySelector(".rdot"), lt, d - (lt - s) - .4);
    }
  }

  function autoFlip(g, s, d) {
    var items = g.querySelectorAll(".flip");
    items.forEach(function (it, i) {
      var a = it.querySelector(".fa"), b = it.querySelector(".fb"), at = s + .5 + i * .75;
      tl.to(a, { opacity: 0, scale: .8, duration: .3, ease: E.exit }, at);
      tl.fromTo(b, { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .45, ease: E.pop }, at + .2);
      pulse(b, at + .7, 1.2);
    });
    var lastB = items.length ? items[items.length - 1].querySelector(".fb") : null;
    if (lastB && d >= 4) tl.to(lastB, { scale: 1.16, duration: d - 2.4, ease: E.enter }, s + 2.2);
  }

  /* SIGNATURE MOVE — the closing ring: draws shut, lands, breathes once. */
  A.signature = function (e, at, d) {
    var bar = e.parentNode.querySelector(".sigbar"), face = e.parentNode.querySelector(".sigface");
    if (face) tl.fromTo(face, { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: E.pop }, at);
    if (bar) {
      var C = ringLen(bar);
      tl.set(bar, { strokeDasharray: C, strokeDashoffset: C }, 0);
      tl.to(bar, { strokeDashoffset: 0, duration: d || 1.3, ease: E.move }, at + .3);
    }
    if (face) pulse(face, at + (d || 1.3) + .4, 1.6);
  };

  /* ===== v1.6 — the last archetype families ===== */

  /* GAUGE — a needle sweeps from the left stop to its value and settles. */
  A.gauge = function (e, at, d) {
    var arc = e.querySelector(".gaugebar"), nd = e.querySelector(".gneedle"),
        num = e.querySelector(".gnum"), pct = n(e.dataset.pct, 70) / 100;
    if (arc) {
      var C = ringLen(arc);
      tl.set(arc, { strokeDasharray: C, strokeDashoffset: C }, 0);
      /* az ív VÉGE és a mutató VÉGE ugyanoda mutasson: a fél-kör arány = pct.
         (feedback 2026-08-29, GAUGE: "nem ugyanoda mutatnak") */
      tl.to(arc, { strokeDashoffset: C * (1 - pct), duration: d || 1.8, ease: E_FILL }, at);
    }
    if (nd) tl.fromTo(nd, { rotation: -90, transformOrigin: "50% 100%" },
      { rotation: -90 + 180 * pct, duration: d || 1.8, ease: E_FILL }, at);
    if (num) A.count(num, at, d || 1.8, num.dataset.val);
  };

  /* CYCLE — the loop draws once round, then the active node lights up. No spinning. */
  A.cycle = function (e, at, d) {
    var ring = e.querySelector(".cycpath"), nodes = e.querySelectorAll(".cycnode");
    d = d || 2.2;
    if (ring) {
      var C = ringLen(ring);
      tl.set(ring, { strokeDasharray: C, strokeDashoffset: C }, 0);
      /* lineáris töltés, hogy a csomópont pontosan akkor gyúljon ki, amikor a
         kör odaér. Feedback 2026-08-29: "nincs olyan, hogy később tölt be." */
      tl.to(ring, { strokeDashoffset: 0, duration: d, ease: E_FILL }, at);
    }
    nodes.forEach(function (nd, i) {
      var t = at + d * (i / Math.max(1, nodes.length)) + .04;
      tl.fromTo(nd, { scale: .4, opacity: 0, transformOrigin: "center" },
        { scale: 1, opacity: 1, duration: .32, ease: E.pop }, t);
    });
    var last = nodes[nodes.length - 1];
    if (last) pulse(last, at + d + .3, 1.6);
  };

  /* FUNNEL — stages narrow downward, each one arrives after the one above it. */
  A.funnelin = function (e, at, d) {
    var st = e.querySelectorAll(".fnst"), step = Math.min(.55, (d || 2.4) / Math.max(1, st.length));
    st.forEach(function (s, i) {
      tl.fromTo(s, { opacity: 0, scaleX: .55, y: -18, transformOrigin: "center top" },
        { opacity: 1, scaleX: 1, y: 0, duration: .6, ease: E.enter }, at + i * step);
    });
    var last = st[st.length - 1];
    if (last) pulse(last, at + st.length * step + .3, 1.4);
  };

  /* KEYWORD ROUTER — one comment fans out to the keyword options. IF/ELSE, quiet.
     Feedback 2026-08-29: "router effect az elejére, valami nem túl harsány." */
  A.kroute = function (e, at, d) {
    var stem = e.querySelector(".krstem"), legs = e.querySelectorAll(".krleg"),
        pills = e.querySelectorAll(".krpill"), dot = e.querySelector(".krdot");
    d = d || 2.6;
    if (stem) A.draw(stem, at, .4);
    if (dot) {
      tl.set(dot, { opacity: 0, attr: { cy: 22 } }, at);
      tl.to(dot, { opacity: 1, duration: .16 }, at + .08);
      tl.to(dot, { attr: { cy: 70 }, duration: .34, ease: E.move }, at + .1);
      tl.to(dot, { opacity: 0, duration: .18 }, at + .46);
    }
    /* mint a 30 BRANCH: a láb 0-ról indul ÉS a doboz felé kivastagodik.
       Feedback 2026-08-29: "0-ról indít, és a szöveg dobozhoz érve kivastagodik." */
    legs.forEach(function (l, i) {
      var lt = at + .44 + i * .12;
      tl.fromTo(l, { strokeDashoffset: 1, strokeWidth: 2 },
        { strokeDashoffset: 0, strokeWidth: 7, duration: .6, ease: E.move }, lt);
    });
    pills.forEach(function (p, i) {
      tl.fromTo(p, { opacity: 0, y: -14, scale: .94 },
        { opacity: 1, y: 0, scale: 1, duration: .5, ease: E.pop }, at + .9 + i * .22);
    });
  };

  /* BRANCH — one line splits into two. Both legs draw, then the chosen leg lands. */
  A.branchin = function (e, at, d) {
    var stem = e.querySelector(".brstem"), legs = e.querySelectorAll(".brleg"),
        ends = e.querySelectorAll(".brend");
    d = d || 2.4;
    if (stem) A.draw(stem, at, .6);
    legs.forEach(function (l, i) { A.draw(l, at + .6 + i * .18, .7); });
    ends.forEach(function (n2, i) {
      tl.fromTo(n2, { opacity: 0, scale: .5, transformOrigin: "center" },
        { opacity: 1, scale: 1, duration: .5, ease: E.pop }, at + 1.3 + i * .25);
    });
    var win = e.querySelector(".brend.win");
    if (win) pulse(win, at + 2, Math.max(1.2, d - 2));
  };

  /* BEFORE / AFTER — a wipe line travels across and reveals the second state. */
  A.wipe = function (e, at, d) {
    var after = e.querySelector(".bafter"), bar = e.querySelector(".bawipe");
    d = d || 1.8;
    if (after) tl.fromTo(after, { clipPath: "inset(0 100% 0 0)" },
      { clipPath: "inset(0 0% 0 0)", duration: d, ease: E.move }, at);
    if (bar) tl.fromTo(bar, { left: "0%", opacity: 0 },
      { left: "100%", opacity: 1, duration: d, ease: E.move }, at);
    if (bar) tl.to(bar, { opacity: 0, duration: .3 }, at + d);
  };

  /* GRID — many small cells arrive as a wave, never all at once. */
  A.gridin = function (e, at, d) {
    var cells = e.querySelectorAll(".gcell");
    tl.fromTo(cells, { opacity: 0, scale: .6, transformOrigin: "center" },
      { opacity: 1, scale: 1, duration: .45, ease: E.pop,
        stagger: { each: (d || 1.8) / Math.max(1, cells.length), from: "start" } }, at);
    var hot = e.querySelector(".gcell.on");
    if (hot) pulse(hot, at + (d || 1.8) + .3, 1.6);
  };

  /* ==========================================================================
     v1.7 — A RENDSZERSZINTŰ ELLENŐRZÉSEK
     Ezek nem animációk. Ezek MÉRÉSEK, amiket eddig ember végzett, rosszul.
     ========================================================================== */

  /* OLVASÁSI IDŐ AUDIT
     Végigmegy minden képre kerülő szövegen, kiszámolja, mennyi ideig kell
     olvasható maradnia, és összeveti azzal, ameddig ténylegesen a képen van.
     A `hyperframes check` a konzolt olvassa, tehát ez ott jelenik meg, a
     kontraszt- és tördelési hibák mellett. */
  var READ_SEL = ".sub,.scl,.tl,.prow,.qline,.qtext,.bnote,.gcap,.brend,.skcap,.leadr,.fnl-l";
  function auditReading(sec, s, d) {
    sec.querySelectorAll(READ_SEL).forEach(function (e) {
      var txt = (e.textContent || "").trim();
      if (!txt) return;
      var words = txt.split(/\s+/).filter(Boolean).length;
      var need = 0.5 + 0.4 * words;
      var at = n(e.dataset.at, 0);
      var onScreen = d - at - 0.32;                  /* a kimenet levonva */
      if (onScreen + 0.05 < need) {
        console.warn("[zg] OLVASHATATLAN " + sec.id + ": " + words + " szo, " +
          need.toFixed(1) + " mp kellene, " + onScreen.toFixed(1) + " mp van. \"" +
          txt.slice(0, 54) + "\"");
      }
    });
  }

  /* HOSSZ-TŰRÉS
     Angol és magyar kiadás megy ki. A magyar szöveg jellemzően 25-30 %-kal
     hosszabb az angolnál. Minden szövegdoboznak ki kell bírnia +30 %-ot
     törés nélkül. Ezt nem tudjuk lefuttatni a magyar szöveggel, mert az még
     nincs meg, de meg tudjuk mérni, mennyi HELY van a doboz szélén. */
  function auditLength(sec) {
    /* Tulajdonnevet NEM mérünk: az "Alex Rivers" magyarul is "Alex Rivers".
       A hossz-tűrés a FORDÍTANDÓ szövegre vonatkozik, nem minden szövegre. */
    sec.querySelectorAll(".scl,.tl,.brend,.fnl-l,.bnote,.gcap").forEach(function (e) {
      var host = e.parentElement;
      if (!host) return;
      var avail = host.clientWidth -
        (parseFloat(getComputedStyle(host).paddingLeft) || 0) -
        (parseFloat(getComputedStyle(host).paddingRight) || 0);
      if (avail < 40) return;
      /* nowrap elemnél a saját szélessége a szöveg szélessége */
      var txtW = e.getBoundingClientRect().width;
      if (txtW < 8) return;
      if (txtW * 1.3 > avail) {
        console.warn("[zg] SZUK DOBOZ " + sec.id + ": +30% hosszal kifolyna (" +
          Math.round(txtW) + "px szoveg, " + Math.round(avail) + "px hely). \"" +
          (e.textContent || "").trim().slice(0, 40) + "\"");
      }
    });
  }

  w.ZG = {
    PULSE: PULSE,
    E: E,
    dur: dur,
    cues: function () { return cues.slice().sort(function (a, b) { return a.t - b.t; }); },
    /* build(id) — the monolithic sampler / a whole document.
       buildIn(root, id) — one mounted archetype block, scoped to its own root.
       Both walk the same scene loop; only the DOM scope differs, so the motion
       a block ships is byte-identical to the motion the sampler approved. */
    build: function (id) { return this._run(null, id || "main"); },
    buildIn: function (root, id) { return this._run(root || null, id || "main"); },
    _run: function (scope, id) {
      var q = scope && scope.nodeType === 1 ? scope : document;
      cues = [];
      if (w.ZGT) w.ZGT.run(scope);   /* v1.7: írásjel-kultúra a mérés ELŐTT */
      if (w.ZGI) w.ZGI.paint(scope); /* v1.6: paint BEFORE measuring — geometry must be final */
      tl = gsap.timeline({ paused: true });
      q.querySelectorAll("section.clip").forEach(function (sec) {
        var s = n(sec.dataset.start, 0), d = n(sec.dataset.duration, 3), cam = sec.querySelector(".cam");
        tl.fromTo(cam, { opacity: 0, y: 44, scale: .97 }, { opacity: 1, y: 0, scale: 1, duration: .5, ease: E.enter }, s);
        tl.to(cam, { scale: 1.03, duration: d, ease: E.move }, s);
        tl.to(cam, { opacity: 0, y: -30, duration: .32, ease: E.exit }, s + Math.max(.34, d - .32));
        tl.set(cam, { opacity: 0 }, s + d);

        /* jelenet-belépő hangja: minden jelenet kap egy halk koppanást */
        cue("scene", s + .12);

        sec.querySelectorAll("[data-anim]").forEach(function (el) {
          var f = A[el.dataset.anim];
          if (f) f(el, s + n(el.dataset.at, 0), n(el.dataset.dur, 0) || undefined, el.dataset.val);
          if (el.dataset.cue) cue(el.dataset.cue, s + n(el.dataset.at, 0));
        });

        /* MOZGÁS-HIERARCHIA
           A `data-hero` elem a jelenet főszereplője. Utoljára érkezik, és
           lassabban, mint bárki más. Ha a főszereplő elsőnek érkezik és
           leggyorsabban, a szem a mellékszereplőkön köt ki, mert azok még
           mozognak, amikor ő már megállt. */
        var hero = sec.querySelector("[data-hero]");
        if (hero && d >= 3) {
          var ht = s + Math.min(d * .34, 1.5);
          tl.fromTo(hero, { opacity: 0, y: 30, scale: .96 },
            { opacity: 1, y: 0, scale: 1, duration: .82, ease: E.enter }, ht);
          cue("hero", ht);
        }

        /* VÉDJEGY-MOZDULAT — a bezáruló gyűrű, mint a film írásjele.
           Nem díszítés. A módszer LELKE: a jóváhagyás a végrehajtás elé kerül,
           a gyűrű nullából telik meg és MEGÁLL. Ugyanez a mozdulat fut le
           minden szakaszzáró jeleneten, a végkártyán és a logó körül.
           Öt videó után a néző a gyűrűről ismer rá a csatornára.
           Jelölés a jelenet-táblában: data-section-end a section elemen. */
        if (sec.hasAttribute("data-section-end")) {
          var w2 = sec.querySelector(".sigwrap");
          if (!w2) {
            w2 = document.createElement("div");
            w2.className = "sigwrap sig-auto";
            w2.setAttribute("data-layout-allow-overlap", "");
            w2.innerHTML =
              '<svg class="sigsvg" viewBox="0 0 210 210">' +
              '<circle class="sigtrack" cx="105" cy="105" r="96"/>' +
              '<circle class="sigbar" cx="105" cy="105" r="96"/></svg>' +
              '<div class="sigface"><span class="ico" data-icon="check"></span></div>';
            (sec.querySelector(".cam") || sec).appendChild(w2);
            if (w.ZGI) w.ZGI.paint(scope);
          }
          var st = s + Math.max(1.2, d - 2.2);
          A.signature(w2.querySelector(".sigbar"), st, 1.3);
          cue("ring", st + .3);
          cue("ringclose", st + 1.6);
        }

        auditReading(sec, s, d);
        auditLength(sec);

        /* A VÉDJEGY-PULZÁLÁS MINDEN GOMBON — nem csak ott, ahol data-pulse van.
           Feedback 2026-08-29 (FORM, END CARD): "minden gombon legyen a pulsating
           effect, ne csak itt, hanem az összes scene-en." */
        sec.querySelectorAll("[data-pulse]").forEach(function (e) {
          var t = n(e.dataset.pulse, 2); pulse(e, s + t, d - t - .4);
        });
        sec.querySelectorAll(".fbtn,.ecbtn,.cpill,.callout,.krpill,.appbtn")
          .forEach(function (b) {
            var land = Math.min(n(b.dataset.at, 0) + 1.2, d * 0.45);
            btnPulse(b, s + land, d - land - .4);
          });

        if (d >= 4) {
          sec.querySelectorAll(".arrow").forEach(function (g) { autoArrow(g, s, d); });
          sec.querySelectorAll(".rail").forEach(function (r) { autoRail(r, s, d); });
          sec.querySelectorAll(".flipgroup").forEach(function (g) { autoFlip(g, s, d); });
        } else {
          sec.querySelectorAll(".arrow").forEach(function (g) {
            tl.from(g.querySelectorAll(".icell"), { opacity: 0, y: 26, duration: .5, stagger: .18, ease: E.enter }, s + .2);
            var l = g.querySelector(".arline"), h = g.querySelector(".arhead");
            if (l) A.draw(l, s + .5, .4); if (h) A.draw(h, s + .85, .25);
          });
          sec.querySelectorAll(".rail").forEach(function (r) {
            tl.from(r.querySelectorAll(".rstop"), { opacity: 0, y: 20, duration: .45, stagger: .12 }, s + .2);
            r.querySelectorAll(".rfill").forEach(function (f) { A.gx(f, s + .4, .6); });
          });
        }
      });
      if (w.ZGI) w.ZGI.paint(scope);
      w.__timelines = w.__timelines || {};
      w.__timelines[id || "main"] = tl;
      /* a hangvezérlő tábla kikerül az ablakra, hogy ki lehessen olvasni */
      w.__zgCues = w.ZG.cues();
      console.log("[zg] hang-jelek: " + w.__zgCues.length + " db, lasd SOUND.md");
      return tl;
    }
  };
})(window);

</script>
<script>
(function(){
  var root = document.querySelector('[data-composition-id="lens"]');
  window.ZG.buildIn(root, "lens");
})();
</script>
</template>
