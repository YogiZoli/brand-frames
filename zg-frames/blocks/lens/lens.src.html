<div class="kick" data-anim="kick" data-at=".1" data-vars='{"text":"kick"}'>14 · LENS · MAGNIFIES THE LETTERS</div>
<div class="lenswrap">
  <div class="panel" data-layout-allow-overlap style="height:400px">
    <div class="ptitle" data-vars='{"text":"panelTitle"}'>Lead record</div>
    <div style="display:flex;gap:168px;margin-top:40px">
      <div><div class="reck" data-vars='{"text":"k1"}'>PRIMARY INTENT</div><div style="font-size:50px;font-weight:800;margin-top:8px" data-vars='{"text":"v1"}'>Enterprise scale</div></div>
      <div><div class="reck" data-vars='{"text":"k2"}'>TEMPERATURE</div><div style="font-size:50px;font-weight:800;margin-top:8px;color:var(--green)" data-vars='{"text":"v2"}'>Warm to hot</div></div>
    </div>
  </div>
  <span class="lens" data-layout-allow-overlap data-anim="lens" data-at=".6" data-dur="4.8"
        data-path="57,7;590,7" data-words="Enterprise|Warm"
        data-vars='{"data-path":"lensPath","data-words":"lensWords"}'>
    <span class="lenstxt" data-layout-allow-overlap>Enterprise</span></span>
  <div class="pop tint b" data-layout-allow-overlap style="left:40px;top:452px"
       data-anim="unfold" data-at="1.3" data-dur="1.7">
    <div class="popk" data-vars='{"text":"p1k"}'>what it wants</div><div class="popv" data-vars='{"text":"p1v"}'>A company-size rollout</div></div>
  <div class="pop tint g" data-layout-allow-overlap style="left:620px;top:452px"
       data-anim="unfold" data-at="3.2">
    <div class="popk" data-vars='{"text":"p2k"}'>how ready it is</div><div class="popv" data-vars='{"text":"p2v"}'>Ready to talk this week</div></div>
</div>
<div class="subcap" data-anim="fi" data-at="3.3" data-vars='{"text":"caption"}'>Never an empty glass.</div>
